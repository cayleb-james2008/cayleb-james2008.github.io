    <script>
      // Set the theme before first paint: light by default; dark follows the system scheme until the person chooses,
      // and the choice is kept in localStorage, key "theme" (chrome/theme.tsx, the static pages and the demo apps read it too).
      try {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>

  <body>
    <div id="root"></div>
    <script>
      /* Initial-hash jump for the static project pages that link into this résumé.
         The SPA mounts after load, so wait briefly for the target; any real user
         input cancels the retry so the script can never fight a scroll. (Carried verbatim from the live page.) */
      (() => {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        let timer = null;
        const stop = () => { if (timer) { clearInterval(timer); timer = null; } };
        const jump = () => {
          if (!location.hash) return;
          let id = location.hash.slice(1);
          try { id = decodeURIComponent(id); } catch (e) {}
          const el = document.getElementById(id);
          if (el) el.scrollIntoView({ block: 'start' });
        };
        const start = () => {
          stop();
          let n = 0;
          jump();
          timer = setInterval(() => { jump(); if (++n >= 20) stop(); }, 150);
        };
        ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach((ev) =>
          window.addEventListener(ev, stop, { passive: true }));
        window.addEventListener('load', start);
        window.addEventListener('hashchange', start);
        if (document.readyState !== 'loading') start();
        else document.addEventListener('DOMContentLoaded', start);
      })();
    </script>
