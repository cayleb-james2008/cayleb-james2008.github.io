<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Fleet — live dashboard</title>
<style>
:root{
  --c-base:#171717; --c-panel:#202020; --c-line:#323232; --c-slab:#262626;
  --c-text-1:#DDDDDD; --c-text-2:#A4A4A4; --c-text-2-contrast:#CFCFCF;
  --c-amber:#98763E; --c-mustard:#9E8E3E; --c-red:#8E473A; --c-info:#525252;
  --c-stale-light:#8A8A8A; --c-stale-dark:#3E3E3E;
  --font-sans:"Geist","Geist Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs-chip:12px; --fs-small:13px; --fs-meta:14px; --fs-stat:24px;
  --fw-regular:500; --fw-label:600; --fw-strong:700;
  --lh:1.35; --ls-label:0.06em;
  --sp-unit:4px; --sp-gap:8px; --sp-gutter:16px; --sp-header:48px; --sp-card:12px;
  --radius-base:10px; --radius-control:8px;
  --m-value:280ms; --m-panel:220ms; --m-morph:180ms;
  --m-ease-out:cubic-bezier(0.16,1,0.3,1);
  --shadow-float:0 6px 24px rgba(0,0,0,0.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--c-base);color:var(--c-text-1);font-family:var(--font-sans);font-size:var(--fs-small);line-height:var(--lh);-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100vh;min-height:0}

/* the header: a shelf, not a banner */
.hdr{flex:0 0 var(--sp-header);height:var(--sp-header);display:flex;align-items:center;gap:24px;padding:0 var(--sp-gutter);border-bottom:1px solid var(--c-line)}
.hdr-brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.hdr-title{font-size:var(--fs-small);font-weight:var(--fw-label);letter-spacing:var(--ls-label);text-transform:uppercase;white-space:nowrap}
.hdr-sub{font-size:var(--fs-chip);color:var(--c-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-spacer{flex:1 1 auto}
.hdr-stats{display:flex;gap:20px;align-items:center}
.stat{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.stat-label{font-size:var(--fs-chip);color:var(--c-text-2);letter-spacing:var(--ls-label);text-transform:uppercase}
.stat-value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:var(--fs-stat);font-weight:var(--fw-label);line-height:1}
.hdr-live{display:flex;align-items:center;gap:8px;font-size:var(--fs-chip);color:var(--c-text-2);white-space:nowrap}
.hdr-dot{width:6px;height:6px;border-radius:50%;background:var(--c-mustard)}

/* the stage */
.body{flex:1 1 auto;display:flex;min-height:0}
.stage{flex:1 1 auto;min-width:0;min-height:0;overflow:auto;padding:var(--sp-gutter);position:relative;display:flex;flex-direction:column}
.stage-cap{flex:0 0 auto;font-size:var(--fs-chip);color:var(--c-text-2);letter-spacing:var(--ls-label);text-transform:uppercase;margin:0 0 8px 2px}
/* The graph takes the whole stage and centres itself in it. The SVG keeps its
   own size — one SVG unit is one CSS pixel, so the type is the size it was set
   at and the drawing is not rescaled behind the reader's back. */
.graph-wrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#graph{display:block;max-width:100%;max-height:100%}
/* The key, along the bottom: the state colours named, so a cold viewer reads
   the graph without having to guess what a colour means. */
.legend-strip{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-top:12px;margin-top:12px;border-top:1px solid var(--c-line)}
.legend-strip span{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-chip);color:var(--c-text-2);letter-spacing:var(--ls-label);text-transform:uppercase}
.legend-strip .hint{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--font-mono)}
.swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
.side{flex:0 0 380px;border-left:1px solid var(--c-line);overflow-y:auto;padding:var(--sp-gutter);background:var(--c-base)}

/* the graph's objects */
.n-depth{fill:#0e0e0e}
.n-face{fill:var(--c-panel);stroke:var(--c-line);stroke-width:1}
.n-lip{stroke:rgba(255,255,255,0.06);stroke-width:1;fill:none}
.n-perf{stroke:var(--c-line);stroke-width:1;stroke-dasharray:3 3;fill:none}
.n-notch{fill:var(--c-base)}
.n-title{font-family:var(--font-sans);font-size:13px;font-weight:var(--fw-label);fill:var(--c-text-1)}
.n-sub{font-family:var(--font-sans);font-size:12px;fill:var(--c-text-2)}
.n-state{font-family:var(--font-sans);font-size:12px;font-weight:var(--fw-strong);letter-spacing:var(--ls-label)}
.p-text{font-family:var(--font-sans);font-size:12px;font-weight:var(--fw-strong);letter-spacing:var(--ls-label)}
.n-meta{font-family:var(--font-mono);font-size:12px;fill:var(--c-text-2)}
.n-mono{font-family:var(--font-mono);font-size:12px;fill:var(--c-text-2)}
.n-tag{fill:none;stroke-width:1}
.n-tagtext{font-family:var(--font-sans);font-size:12px;font-weight:var(--fw-label);letter-spacing:var(--ls-label);fill:var(--c-text-2)}
.n-stub{fill:var(--c-text-1)}
.e{fill:none;stroke:var(--c-line);stroke-width:1}
.e-bus{stroke:var(--c-line)}
.e-handover{stroke:var(--c-stale-dark);stroke-dasharray:2 4}
.e-arrow{fill:none;stroke:var(--c-line);stroke-width:1}
.e-handover.e-arrow{stroke:var(--c-stale-dark)}
.node{cursor:pointer;outline:none}
.node .n-face{transition:transform 90ms var(--m-ease-out)}
.node:hover .n-face{stroke:var(--c-text-2)}
.node:focus-visible .n-face{stroke:var(--c-text-1);stroke-width:2}
.node.is-selected .n-face{stroke:var(--c-text-1);stroke-width:2}
.node.is-selected .n-depth{fill:#0a0a0a}
.node.is-dim{opacity:.38}
.node.is-lit .n-face{stroke:var(--c-text-2)}
.node.is-lit .e{stroke:var(--c-stale-light)}

/* the detail panel: a drawer that opens on a node */
.side-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.side-kind{font-size:var(--fs-chip);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--c-text-2)}
.side-title{font-size:var(--fs-small);font-weight:var(--fw-label);margin:0}
.side-sub{font-size:var(--fs-chip);color:var(--c-text-2);margin:2px 0 0}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--radius-control);font-size:var(--fs-chip);font-weight:var(--fw-strong);letter-spacing:var(--ls-label);text-transform:uppercase;white-space:nowrap}
.pill.live{background:var(--c-mustard);color:var(--c-base)}
.pill.chain{background:transparent;color:var(--c-text-1);border:2px solid var(--c-mustard)}
.pill.warn{background:var(--c-amber);color:var(--c-base)}
.pill.crit{background:var(--c-red);color:var(--c-base)}
.pill.neutral{background:transparent;color:var(--c-text-2);border:1px solid var(--c-line)}
.pill.dotted{background:transparent;color:var(--c-text-2);border:1px dotted var(--c-stale-dark)}
.card{border:1px solid var(--c-line);border-radius:var(--radius-base);background:var(--c-panel);padding:var(--sp-card);margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:var(--fs-chip);font-weight:var(--fw-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--c-text-2)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;margin:0;font-size:var(--fs-small)}
.kv dt{color:var(--c-text-2);font-size:var(--fs-chip)}
.kv dd{margin:0;word-break:break-word}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.note{font-size:var(--fs-chip);color:var(--c-text-2);white-space:pre-wrap;word-break:break-word}
.note-block{border-left:2px solid var(--c-line);padding-left:10px;margin:0 0 10px}
.note-block h4{margin:0 0 2px;font-size:var(--fs-chip);font-weight:var(--fw-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--c-text-2)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--c-line);font-size:var(--fs-small)}
.list li:first-child{border-top:none}
.list .lid{font-family:var(--font-mono);font-size:var(--fs-chip);color:var(--c-text-2);min-width:56px}
.list .lt{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-actions{display:flex;gap:8px;margin-bottom:12px}
.btn{appearance:none;font:inherit;font-size:var(--fs-chip);font-weight:var(--fw-label);letter-spacing:var(--ls-label);text-transform:uppercase;height:24px;padding:0 10px;border-radius:var(--radius-control);border:1px solid var(--c-line);background:transparent;color:var(--c-text-2);cursor:pointer}
.btn:hover{color:var(--c-text-1);border-color:var(--c-text-2)}
.btn:focus-visible{outline:2px solid var(--c-text-1);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-chip);color:var(--c-text-2)}
.swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
[data-motion="morph"]{display:inline-block;transition:transform var(--m-morph) var(--m-ease-out),opacity var(--m-morph) var(--m-ease-out)}
[data-motion="morph"][data-phase="out"]{transform:translateY(-2px);opacity:0}
[data-motion="morph"][data-phase="in"]{transform:translateY(2px);opacity:0}
[data-motion="morph"][data-phase="idle"]{transform:translateY(0);opacity:1}
@media (prefers-reduced-motion:reduce){
  :root{--m-value:0ms;--m-panel:0ms;--m-morph:0ms}
  .node .n-face{transition:none}
  [data-motion="morph"]{transition:none}
}

@media (max-width:720px){
  .hdr{flex:0 0 auto;height:auto;flex-wrap:wrap;gap:10px 16px;padding:10px var(--sp-gutter)}
  .hdr-stats{width:100%;justify-content:flex-start;gap:14px}
  .body{flex-direction:column}
  .stage{flex:0 0 auto;min-height:58vh;overflow-x:auto}
  .stage-cap::after{content:" — swipe the graph sideways to pan";text-transform:none;letter-spacing:0;font-family:var(--font-mono)}
  .graph-wrap{justify-content:flex-start;align-items:flex-start}
  #graph{width:1120px !important;height:756px !important;max-width:none !important;max-height:none !important;flex:0 0 auto}
  .side{flex:0 0 auto;width:100%;max-height:none;border-left:0;border-top:1px solid var(--c-line)}
  .legend-strip .hint{display:none}
}
</style>
</head>

<script>(function clientScript() {
  const graph = JSON.parse(document.getElementById('fleet-graph').textContent)
  const snap = JSON.parse(document.getElementById('fleet-snapshot').textContent)
  const byId = new Map(graph.nodes.map(n => [n.id, n]))
  const detail = document.getElementById('detail')
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches

  const esc = v => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')

  const toneClass = tone => {
    if (tone === 'live') return 'live'
    if (tone === 'chain') return 'chain'
    if (tone === 'warn') return 'warn'
    if (tone === 'crit') return 'crit'
    if (tone === 'dotted') return 'dotted'
    return 'neutral'
  }

  const ago = iso => {
    if (!iso) return '—'
    const ms = Date.now() - Date.parse(iso)
    if (!Number.isFinite(ms)) return '—'
    const mins = Math.floor(ms / 60000)
    if (mins < 1) return 'just now'
    if (mins < 60) return `${mins}m ago`
    const hrs = Math.floor(mins / 60)
    if (hrs < 24) return `${hrs}h ago`
    return `${Math.floor(hrs / 24)}d ago`
  }

  const clock = iso => {
    if (!iso) return '—'
    const d = new Date(iso)
    if (Number.isNaN(d.getTime())) return '—'
    return d.toISOString().slice(11, 19) + 'Z'
  }

  const notesBlock = notes => {
    if (!notes) return ''
    const sections = [['State', 'state'], ['Blockers', 'blockers'], ['Next step', 'nextStep']]
    const body = sections
      .filter(([, key]) => (notes[key] ?? '').trim().length > 0)
      .map(([label, key]) => `<div class="note-block"><h4>${esc(label)}</h4><p class="note">${esc(notes[key].trim())}</p></div>`)
      .join('')
    return body
  }

  const kv = pairs => `<dl class="kv">${pairs.filter(p => p[1] !== null && p[1] !== undefined && p[1] !== '').map(p => `<dt>${esc(p[0])}</dt><dd>${p[2] === 'mono' ? `<span class="mono">${esc(p[1])}</span>` : esc(p[1])}</dd>`).join('')}</dl>`

  const missionRow = m => `<li><span class="lid mono">${esc(m.id)}</span><span class="lt">${esc(m.title)}</span><span class="pill ${toneClass(m.tone)}">${esc(m.stateWord)}</span></li>`

  function detailFor(node) {
    if (node.kind === 'harness') {
      const c = snap.counters ?? {}
      const tools = (snap.tools ?? [])
      return `
        <div class="side-head"><div><p class="side-kind">The swarm</p><h2 class="side-title">${esc(node.label)}</h2><p class="side-sub">${esc(node.sub)}</p></div><span class="pill live" data-motion="morph" data-phase="idle">${esc(node.stateWord)}</span></div>
        <div class="side-actions"><button class="btn" type="button" data-goto="muse">Muse</button><button class="btn" type="button" data-goto="duet">Duet</button><button class="btn" type="button" data-goto="builder">Builder</button></div>
        <div class="card"><h3>Now</h3>${kv([
        ['Lanes', String(c.lanes ?? 0)],
        ['Missions', String(c.missions ?? 0)],
        ['Tickets', String(c.tickets ?? 0)],
        ['Participants', String(c.participants ?? 0)],
        ['Tools', String(c.tools ?? 0)],
        ['Captured', clock(snap.$meta?.capturedAt)],
      ])}</div>
        <div class="card"><h3>Model rotation</h3>${kv((snap.rotation ?? []).map(r => [r.provider, `${r.model}${r.reasoningEffort ? ' · ' + r.reasoningEffort : ''}`, 'mono'])) || '<p class="note">no rotation set</p>'}</div>
        <div class="card"><h3>Tools the fleet built</h3>${tools.length === 0 ? '<p class="note">none yet</p>' : `<ul class="list">${tools.map(t => `<li><span class="lid mono">${esc(t.id)}</span><span class="lt">${esc(t.name)}</span><span class="pill neutral">${esc(String(t.uses))} uses</span></li>`).join('')}</ul>`}</div>
        <div class="card"><h3>How to read this</h3><p class="note">Work originates at Muse and Duet, enters the harness, and is dispatched to a lane. A lane hands its queue to its named successor when it empties. The work units at the bottom are the missions in flight; the ones tagged TICKET came in through the Slack intake. The key along the bottom of the graph names every state.</p></div>`
    }

    if (node.kind === 'origin' || node.kind === 'lane') {
      const lane = (snap.lanes ?? []).find(l => l.id === node.laneId) ?? {}
      const holder = (snap.laneHolders ?? []).find(h => h.id === node.laneId) ?? {}
      const held = (snap.missions ?? []).filter(m => m.laneId === node.laneId).sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)))
      const successor = (snap.lanes ?? []).find(l => l.id === lane.successor)
      const lead = (snap.lanes ?? []).find(l => l.id === lane.leadId)
      return `
        <div class="side-head"><div><p class="side-kind">${node.kind === 'origin' ? 'Where work originates' : 'Lane'}</p><h2 class="side-title">${esc(node.label)}</h2><p class="side-sub">${esc(node.sub ?? '')}</p></div><span class="pill ${toneClass(node.tone)}" data-motion="morph" data-phase="idle">${esc(node.stateWord)}</span></div>
        <div class="card"><h3>Lane</h3>${kv([
        ['Kind', lane.kind],
        ['Status', lane.status],
        ['Lead', lead ? lead.name : '—'],
        ['Hands over to', successor ? successor.name : '—'],
        ['Queue', `${(lane.queue ?? []).length} waiting`, 'mono'],
        ['Held', `${held.length} missions`, 'mono'],
        ['In flight', `${held.filter(m => m.status !== 'done').length}`, 'mono'],
        ['Last activity', ago(lane.lastActivity)],
      ])}</div>
        <div class="card"><h3>Notes — the lane's own record</h3>${notesBlock(holder.notes) || '<p class="note">no notes written yet</p>'}</div>
        <div class="card"><h3>Missions</h3>${held.length === 0 ? '<p class="note">no missions yet</p>' : `<ul class="list">${held.slice(0, 8).map(m => `<li><span class="lid mono">${esc(m.id)}</span><span class="lt">${esc(m.title)}</span><span class="pill ${toneClass(m.tone)}">${esc(m.stateWord)}</span></li>`).join('')}</ul>`}</div>`
    }

    const m = (snap.missions ?? []).find(x => x.id === node.missionId) ?? {}
    const ticket = (snap.tickets ?? []).find(t => t.missionId === node.missionId) ?? null
    const lane = (snap.lanes ?? []).find(l => l.id === m.laneId)
    return `
      <div class="side-head"><div><p class="side-kind">${node.ticket ? 'Work unit · from a ticket' : 'Work unit'}</p><h2 class="side-title mono">${esc(node.label)}</h2><p class="side-sub">${esc(m.title ?? '')}</p></div><span class="pill ${toneClass(node.tone)}" data-motion="morph" data-phase="idle">${esc(node.stateWord)}</span></div>
      ${ticket ? `<div class="card"><h3>The ticket</h3>${kv([
      ['Reference', ticket.title ?? '—'],
      ['Filed by', ticket.filedBy ?? '—'],
      ['Channel', ticket.channel ?? '—'],
      ['Thread', ticket.threadTs ?? '—', 'mono'],
      ['Became', ticket.missionId ?? '—', 'mono'],
      ['Outcome', ticket.outcomePending ? 'still pending' : (ticket.outcomeText ?? 'sent'), 'mono'],
    ])}</div>` : ''}
      <div class="card"><h3>Mission</h3>${kv([
      ['Status', m.status],
      ['Lane', lane ? lane.name : '—'],
      ['Domain', m.domain ?? '—'],
      ['Created', ago(m.createdAt)],
      ['Updated', ago(m.updatedAt)],
      ['Checker rounds', String(m.checkerRounds ?? 0), 'mono'],
      ['Attempts', String(m.attempts ?? 0), 'mono'],
      ['Verdict', m.verdict === null || m.verdict === undefined ? 'none yet' : (m.verdict.pass ? 'PASS' : 'FAIL')],
      ['Model', m.model ? `${m.provider}:${m.model}` : '—', 'mono'],
      ['Tier', m.tier ?? '—'],
    ])}</div>
      ${m.verdict && m.verdict.finding ? `<div class="card"><h3>The checker said</h3><p class="note">${esc(m.verdict.finding)}</p></div>` : ''}`
  }

  // The morph: the state word changes the way the house says a word changes —
  // the DOM always holds a whole word, and it is a transform, never a fade.
  function morphWord(el, text) {
    if (el === null || el === undefined) return
    if (el.textContent === text) return
    if (reduce) { el.textContent = text; return }
    el.dataset.phase = 'out'
    window.setTimeout(() => {
      el.textContent = text
      el.dataset.phase = 'in'
      window.requestAnimationFrame(() => { el.dataset.phase = 'idle' })
    }, 90)
  }

  // The tween: a value that changed moves between two readings. It never runs
  // on the first paint, so there is no count-up.
  function tweenValue(el, from, to) {
    if (reduce || !Number.isFinite(from) || !Number.isFinite(to) || from === to) {
      el.textContent = String(to)
      return
    }
    const start = performance.now()
    const step = now => {
      const t = Math.min(1, (now - start) / 280)
      const eased = 1 - Math.pow(1 - t, 3)
      el.textContent = String(Math.round(from + (to - from) * eased))
      if (t < 1) window.requestAnimationFrame(step)
    }
    window.requestAnimationFrame(step)
  }

  function select(id, push) {
    const node = byId.get(id) ?? byId.get('harness')
    if (node === undefined) return
    document.body.dataset.selected = node.id
    window.history.replaceState(null, '', `#node=${node.id}`)
    for (const el of document.querySelectorAll('.node')) {
      el.classList.toggle('is-selected', el.dataset.nodeId === node.id)
    }
    detail.innerHTML = detailFor(node)
    const pill = detail.querySelector('.pill')
    if (pill !== null) morphWord(pill, node.stateWord)
    for (const btn of detail.querySelectorAll('[data-goto]')) {
      btn.addEventListener('click', () => select(btn.dataset.goto, true))
    }
  }

  for (const el of document.querySelectorAll('.node')) {
    el.addEventListener('click', () => select(el.dataset.nodeId, true))
    el.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault()
        select(el.dataset.nodeId, true)
      }
    })
    el.addEventListener('mouseenter', () => {
      for (const other of document.querySelectorAll('.node')) other.classList.add('is-dim')
      el.classList.remove('is-dim')
    })
    el.addEventListener('mouseleave', () => {
      for (const other of document.querySelectorAll('.node')) other.classList.remove('is-dim')
    })
  }

  const fromHash = window.location.hash.replace(/^#node=/, '')
  select(fromHash.length > 0 && byId.has(fromHash) ? fromHash : 'harness', false)
})()</script>
</body>
</html>
