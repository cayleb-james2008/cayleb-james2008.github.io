<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="refresh" content="0; url=./" />
    <title>Cayleb Alvarez-James — résumé</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script src="./site/house/theme.js"></script>
    <link rel="stylesheet" href="./site/house/tokens.css" />
    <link rel="stylesheet" href="./site/house/base.css" />
    <style>
      .resume-redirect {
        max-width: 640px;
        margin: 64px auto;
        padding: 24px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius-card);
        background: var(--surface);
      }
      .resume-redirect h1 {
        font: 600 var(--text-title)/var(--text-title-lh) var(--font-sans);
        margin-bottom: 8px;
      }
      .resume-redirect p {
        color: var(--ink-2);
        font: 400 var(--text-ui)/var(--text-ui-lh) var(--font-sans);
      }
      .resume-redirect__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }
      .resume-redirect__link {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius-control);
        background: var(--board);
        color: var(--ink);
        font: 500 var(--text-sm)/1 var(--font-sans);
        text-decoration: none;
      }
      .resume-redirect__link:hover {
        background: var(--track);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="resume-redirect">
        <h1>Cayleb Alvarez-James — résumé</h1>
        <p>Redirecting to the interactive résumé edition at cayleb-james2008.github.io.</p>
        <div class="resume-redirect__actions">
          <a class="resume-redirect__link" href="./">Open interactive résumé →</a>
          <a class="resume-redirect__link" href="./Cayleb-Alvarez-James-Resume.pdf" download>Download plain PDF</a>
        </div>
      </div>
    </main>
    <script>location.replace('./');</script>
  </body>
</html>
